services:
  sqlserver:
    image: "mcr.microsoft.com/mssql/server:2025-latest"
    platform: linux/amd64
    environment:
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?set this in .env}"
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
    ports: ["1433:1433"]
    volumes:
      - sqldata:/var/opt/mssql
      - ./data:/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s

  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: "RootCause"
      POSTGRES_DB: "RootCause"
    ports: ["5432:5432"]
    volumes:  ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d RootCause"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli","ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:4-management
    ports: ["5672:5672","15672:15672"]
    healthcheck:
      test: ["CMD","rabbitmq-diagnostics", "-q", "ping"]
      interval: 15s
      timeout: 5s
      retries: 5

volumes:
  sqldata:
  pgdata:
  
      

    
      