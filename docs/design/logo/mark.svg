<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Performance View">
  <title>Performance View</title>
  <rect width="24" height="24" rx="5.5" fill="#0B7A72"/>
  <!-- three bars, descending: the shape of a query getting faster -->
  <rect x="5"    y="6"  width="3.4" height="12" rx="1.2" fill="#FFFFFF" opacity=".95"/>
  <rect x="10.3" y="10" width="3.4" height="8"  rx="1.2" fill="#FFFFFF" opacity=".72"/>
  <rect x="15.6" y="14" width="3.4" height="4"  rx="1.2" fill="#FFFFFF" opacity=".50"/>
</svg>
